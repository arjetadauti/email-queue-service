# Render Blueprint: https://render.com/docs/blueprint-spec
# New > Blueprint > pick this repo. Then set RESEND_API_KEY (and EMAIL_FROM) in the dashboard.
services:
  - type: web
    name: email-queue-service
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run migrate && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: email-queue-db
          property: connectionString
      # Internal Render URL: no TLS needed. Use "true" with an external URL (e.g. Neon).
      - key: PGSSL
        value: "false"
      - key: RUN_WORKER_IN_PROCESS
        value: "true"
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: WORKER_HEARTBEAT_URL
        sync: false

databases:
  - name: email-queue-db
    plan: free
    databaseName: email_queue
